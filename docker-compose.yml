services:
  app:
    build: .
    container_name: user-management-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/user-management
      JWT_SECRET: docker_jwt_secret
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: user-management-mongo
    ports:
      - "27018:27017"
    volumes:
      - user_management_mongo_data:/data/db

volumes:
  user_management_mongo_data: